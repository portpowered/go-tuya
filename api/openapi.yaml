info:
  description: Inventory of outbound HTTP routes currently used by pkg/tuya. Operations tagged x-go-tuya-evidence=provider-documented are listed in Tuya Device Management. Operations tagged implementation-derived describe private app/mobile routes observed in go-tuya and are not provider-verified. Request and response objects stay open where the public reference or current implementation does not establish a complete schema. MQTT traffic is a separate protocol; the HTTP route that obtains MQTT credentials is included. EncryptedClient wraps HTTP request bodies and query data, signs requests with the headers, and decrypts the outer response envelope described below.
  title: Tuya Cloud HTTP API routes used by go-tuya
  version: 1.0.0
  x-go-tuya-encrypted-transport:
    request-envelope:
      $ref: '#/components/schemas/EncryptedDataEnvelope'
    request-headers:
      $ref: '#/components/schemas/EncryptedRequestHeaders'
    response-envelope:
      $ref: '#/components/schemas/EncryptedHTTPResponseEnvelope'
openapi: 3.1.0
