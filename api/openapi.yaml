openapi: 3.1.0
info:
  title: Tuya Cloud HTTP API routes used by go-tuya
  version: 1.0.0
  description: Inventory of outbound HTTP routes currently used by pkg/tuya. Operations tagged x-go-tuya-evidence=provider-documented
    are listed in Tuya Device Management. Operations tagged implementation-derived describe private app/mobile
    routes observed in go-tuya and are not provider-verified. Request and response objects stay open where
    the public reference or current implementation does not establish a complete schema. MQTT traffic
    is a separate protocol; the HTTP route that obtains MQTT credentials is included. EncryptedClient wraps
    HTTP request bodies and query data, signs requests with the headers, and decrypts the outer response
    envelope described below.
  x-go-tuya-encrypted-transport:
    request-envelope:
      $ref: '#/components/schemas/EncryptedDataEnvelope'
    request-headers:
      $ref: '#/components/schemas/EncryptedRequestHeaders'
    response-envelope:
      $ref: '#/components/schemas/EncryptedHTTPResponseEnvelope'
paths:
  /v1.0/devices/{device_id}:
    get:
      operationId: getDeviceDetails
      summary: Get device details
      description: Provider-documented in Tuya’s Device Management API reference.
      tags:
      - Device management
      x-go-tuya-evidence: provider-documented
      parameters:
      - name: device_id
        in: path
        required: true
        description: Device ID.
        schema:
          type: string
      responses:
        '200':
          description: Successful response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailsEnvelope'
        default:
          description: Error envelope varies by provider route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuyaErrorEnvelope'
      externalDocs:
        description: Tuya Device Management API
        url: https://developer.tuya.com/en/docs/cloud/device-management?id=K9g6rfntdz78a
    delete:
      operationId: deleteDevice
      summary: Delete a device
      description: Provider-documented in Tuya’s Device Management API reference.
      tags:
      - Device management
      x-go-tuya-evidence: provider-documented
      parameters:
