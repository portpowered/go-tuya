      externalDocs:
        description: Tuya Device Management API
        url: https://developer.tuya.com/en/docs/cloud/device-management?id=K9g6rfntdz78a
    put:
      operationId: updateDeviceName
      summary: Modify a device name
      description: Provider-documented in Tuya’s Device Management API reference.
      tags:
      - Device management
      x-go-tuya-evidence: provider-documented
      parameters:
