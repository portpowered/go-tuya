      externalDocs:
        description: Tuya Device Management API
        url: https://developer.tuya.com/en/docs/cloud/device-management?id=K9g6rfntdz78a
      operationId: getDeviceList
      parameters:
        - description: Comma-separated device IDs.
          in: query
          name: device_ids
          required: false
          schema:
            type: string
        - description: Product ID filter.
          in: query
          name: product_id
          required: false
          schema:
            type: string
        - description: Application schema filter.
          in: query
          name: schema
          required: false
          schema:
            type: string
        - description: Continuation cursor shown in Tuya examples and used by the client.
          in: query
          name: last_id
          required: false
          schema:
            type: string
        - description: Number of entries returned per page.
          in: query
          name: page_size
          required: true
          schema:
            type: integer
        - description: Current page number.
          in: query
          name: page_no
          required: true
          schema:
            type: integer
        - description: 10-digit start timestamp as documented by Tuya.
          in: query
          name: start_time
          required: false
          schema:
            type: string
        - description: 10-digit end timestamp as documented by Tuya.
          in: query
          name: end_time
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
