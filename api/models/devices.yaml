    DeviceListEnvelope:
      type: object
      description: Official Tuya device-list response envelope. Unknown provider metadata is retained.
      additionalProperties: true
      properties:
        code:
          type: integer
        msg:
          type: string
        success:
          type: boolean
        t:
          type: integer
          format: int64
        tid:
          type: string
        result:
          $ref: '#/components/schemas/DeviceListResult'
