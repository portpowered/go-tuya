components:
  schemas:
    MessageQueueSubscription:
      type: object
      description: MQTT topic subscription data returned by the private config route.
      additionalProperties: true
      properties:
        sub:
          type: string
    MessageQueueTopic:
      type: object
      description: MQTT topic groups returned by the private config route.
      additionalProperties: true
      properties:
        ownerId:
          $ref: '#/components/schemas/MessageQueueSubscription'
        devId:
          $ref: '#/components/schemas/MessageQueueSubscription'
    MessageQueueConfiguration:
      type: object
      description: MQTT connection fields consumed by the library. Treat credentials
        as secrets.
      additionalProperties: true
      properties:
        url:
          type: string
        clientId:
          type: string
        username:
          type: string
        password:
          type: string
        expireTime:
          type: integer
          format: int64
        topic:
          $ref: '#/components/schemas/MessageQueueTopic'
    MessageQueueConfigBody:
      type: object
      description: Link identifier payload used to request MQTT connection credentials.
      additionalProperties: true
      properties:
        linkId:
          type: string
      required:
      - linkId
    MessageQueueConfigEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/MessageQueueConfiguration'
