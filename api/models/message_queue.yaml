components:
  schemas:
    MessageQueueSubscription:
      type: object
      description: MQTT topic subscription data returned by the private config route.
      additionalProperties: true
      properties:
        sub:
          type: string
      example:
        sub: synthetic/owner/events
      x-example-evidence: synthetic
    MessageQueueTopic:
      type: object
      description: MQTT topic groups returned by the private config route.
      additionalProperties: true
      properties:
        ownerId:
          $ref: '#/components/schemas/MessageQueueSubscription'
        devId:
          $ref: '#/components/schemas/MessageQueueSubscription'
      example:
        ownerId:
          sub: synthetic/owner/events
        devId:
          sub: synthetic/device/{devId}/events
      x-example-evidence: synthetic
    MessageQueueConfiguration:
      type: object
      description: MQTT connection fields consumed by the library. Treat credentials
        as secrets.
      additionalProperties: true
      properties:
        url:
          type: string
        clientId:
          type: string
        username:
          type: string
        password:
          type: string
        expireTime:
          type: integer
          format: int64
        topic:
          $ref: '#/components/schemas/MessageQueueTopic'
      example:
        url: mqtts://broker.example.invalid:8883
        clientId: synthetic-client-001
        username: synthetic-mqtt-user
        password: synthetic-mqtt-password
        expireTime: 1700003600
        topic:
          ownerId:
            sub: synthetic/owner/events
          devId:
            sub: synthetic/device/{devId}/events
      x-example-evidence: synthetic
    MessageQueueConfigBody:
      type: object
      description: Link identifier payload used to request MQTT connection credentials.
      additionalProperties: true
      properties:
        linkId:
          type: string
      required:
      - linkId
      example:
        linkId: synthetic-link-001
      x-example-evidence: synthetic
    MessageQueueConfigEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/MessageQueueConfiguration'
      example:
        code: 200
        msg: success
        success: true
        t: 1700000000000
        tid: synthetic-trace-mqtt-001
        result:
          url: mqtts://broker.example.invalid:8883
          clientId: synthetic-client-001
          username: synthetic-mqtt-user
          password: synthetic-mqtt-password
          expireTime: 1700003600
          topic:
            ownerId:
              sub: synthetic/owner/events
            devId:
              sub: synthetic/device/{devId}/events
      x-example-evidence: synthetic
