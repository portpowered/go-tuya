components:
  schemas:
    RTCSessionResult:
      type: object
      description: WebRTC signaling response fields consumed by the library.
      additionalProperties: true
      properties:
        session_id:
          type: string
        sdp:
          type: string
      example:
        session_id: synthetic-rtc-session-001
        sdp: |-
          v=0
          o=- synthetic-session 1 IN IP4 127.0.0.1
          s=synthetic-session
          t=0 0
      x-example-evidence: synthetic
    RTCOfferBody:
      type: object
      description: WebRTC offer payload sent to Tuya signaling.
      additionalProperties: true
      properties:
        sdp:
          type: string
        type:
          type: string
          enum:
          - offer
      required:
      - sdp
      - type
      example:
        type: offer
        sdp: |-
          v=0
          o=- synthetic-offer 1 IN IP4 127.0.0.1
          s=synthetic-offer
          t=0 0
      x-example-evidence: synthetic
    RTCSessionEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/RTCSessionResult'
      example:
        code: 200
        msg: success
        success: true
        t: 1700000000000
        tid: synthetic-trace-rtc-001
        result:
          session_id: synthetic-rtc-session-001
          sdp: |-
            v=0
            o=- synthetic-answer 1 IN IP4 127.0.0.1
            s=synthetic-answer
            t=0 0
      x-example-evidence: synthetic
