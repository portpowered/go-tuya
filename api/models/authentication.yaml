components:
  schemas:
    AuthenticationOrigin:
      type: string
      description: Implementation-derived default QR authentication origin.
      enum: [https://apigw.iotbing.com]
      x-enum-varnames: [AuthenticationOriginDefault]
      example: https://apigw.iotbing.com
      x-example-evidence: synthetic
      x-go-tuya-evidence: implementation-derived
    QRCodeTokenPrefix:
      type: string
      description: Implementation-derived Smart Life QR token prefix; append the returned login code unchanged.
      enum: ["tuyaSmart--qrLogin?token="]
      x-enum-varnames: [QRCodeTokenPrefixSmartLife]
      example: "tuyaSmart--qrLogin?token="
      x-example-evidence: synthetic
      x-go-tuya-evidence: implementation-derived
    JSONMediaType:
      type: string
      description: Implementation-derived JSON media type used by the QR authentication headers.
      enum:
      - application/json
      x-enum-varnames:
      - JSONMediaTypeApplicationJSON
      example: application/json
      x-example-evidence: synthetic
      x-go-tuya-evidence: implementation-derived
    QRCodeResult:
      type: object
      description: QR login payload observed by the library.
      additionalProperties: true
      properties:
        qrcode:
          type: string
      example:
        qrcode: https://example.invalid/qr/synthetic-login
      x-example-evidence: synthetic
    LoginCodeResult:
      type: object
      description: Login token payload observed by the library.
      additionalProperties: true
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expire_time:
          type: integer
          format: int64
        terminal_id:
          type: string
        uid:
          type: string
        username:
          type: string
        endpoint:
          type: string
      example:
        access_token: synthetic-access-token
        refresh_token: synthetic-refresh-token
        expire_time: 1700003600
        terminal_id: synthetic-terminal-001
        uid: synthetic-user-001
        username: synthetic-user
        endpoint: https://example.invalid
      x-example-evidence: synthetic
    RefreshedTokenResult:
      type: object
      description: Refresh-token payload observed by the library.
      additionalProperties: true
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expireTime:
          type: integer
          format: int64
        uid:
          type: string
      example:
        accessToken: synthetic-access-token-rotated
        refreshToken: synthetic-refresh-token-rotated
        expireTime: 1700007200
        uid: synthetic-user-001
      x-example-evidence: synthetic
    QRCodeEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/QRCodeResult'
      example:
        code: 200
        msg: success
        success: true
        t: 1700000000000
        tid: synthetic-trace-001
        result:
          qrcode: https://example.invalid/qr/synthetic-login
      x-example-evidence: synthetic
    LoginCodeEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/LoginCodeResult'
      example:
        code: 200
        msg: success
        success: true
        t: 1700000000000
        tid: synthetic-trace-002
        result:
          access_token: synthetic-access-token
          refresh_token: synthetic-refresh-token
          expire_time: 1700003600
          terminal_id: synthetic-terminal-001
          uid: synthetic-user-001
          username: synthetic-user
          endpoint: https://example.invalid
      x-example-evidence: synthetic
    RefreshTokenEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/RefreshedTokenResult'
      example:
        code: 200
        msg: success
        success: true
        t: 1700000000000
        tid: synthetic-trace-003
        result:
          accessToken: synthetic-access-token-rotated
          refreshToken: synthetic-refresh-token-rotated
          expireTime: 1700007200
          uid: synthetic-user-001
      x-example-evidence: synthetic
