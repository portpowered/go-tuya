components:
  schemas:
    AuthenticationOrigin:
      type: string
      description: Implementation-derived default QR authentication origin.
      enum: [https://apigw.iotbing.com]
      x-enum-varnames: [AuthenticationOriginDefault]
      x-go-tuya-evidence: implementation-derived
    QRCodeTokenPrefix:
      type: string
      description: Implementation-derived Smart Life QR token prefix; append the returned login code unchanged.
      enum: ["tuyaSmart--qrLogin?token="]
      x-enum-varnames: [QRCodeTokenPrefixSmartLife]
      x-go-tuya-evidence: implementation-derived
    JSONMediaType:
      type: string
      description: Implementation-derived JSON media type used by the QR authentication headers.
      enum:
      - application/json
      x-enum-varnames:
      - JSONMediaTypeApplicationJSON
      x-go-tuya-evidence: implementation-derived
    QRCodeResult:
      type: object
      description: QR login payload observed by the library.
      additionalProperties: true
      properties:
        qrcode:
          type: string
    LoginCodeResult:
      type: object
      description: Login token payload observed by the library.
      additionalProperties: true
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expire_time:
          type: integer
          format: int64
        terminal_id:
          type: string
        uid:
          type: string
        username:
          type: string
        endpoint:
          type: string
    RefreshedTokenResult:
      type: object
      description: Refresh-token payload observed by the library.
      additionalProperties: true
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expireTime:
          type: integer
          format: int64
        uid:
          type: string
    QRCodeEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/QRCodeResult'
    LoginCodeEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/LoginCodeResult'
    RefreshTokenEnvelope:
      type: object
      description: Tuya response envelope observed by the library. Unspecified envelope
        fields are retained.
      additionalProperties: true
      properties:
        code:
          type: integer
          description: Provider response code when present.
        msg:
          type: string
          description: Provider response message when present.
        success:
          type: boolean
          description: Whether the operation succeeded, when present.
        t:
          type: integer
          description: Provider response timestamp when present.
          format: int64
        tid:
          type: string
          description: Provider trace identifier when present.
        result:
          $ref: '#/components/schemas/RefreshedTokenResult'
