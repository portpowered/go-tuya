asyncapi: 3.0.0
info:
  title: go-tuya message subscriptions
  version: 0.1.0
  description: >-
    Implementation-derived description of the MQTT subscriptions in go-tuya.
    Topic templates and broker settings come from the encrypted access/config
    response. This is not a provider-verified MQTT wire specification.
servers:
  configuredBroker:
    host: '{brokerHost}'
    protocol: mqtt
    description: Broker host supplied at runtime by the access/config response.
    variables:
      brokerHost:
        default: example.invalid
channels:
  ownerEvents:
    address: '{ownerTopic}'
    description: Owner topic supplied by the access/config response.
    parameters:
      ownerTopic:
        description: Runtime subscription topic.
    messages:
      event:
        $ref: '#/components/messages/SharingEvent'
  deviceStatus:
    address: '{deviceTopic}/sta'
    description: Device topic from access/config after replacing its devId token.
    parameters:
      deviceTopic:
        description: Runtime device topic prefix.
    messages:
      event:
        $ref: '#/components/messages/SharingEvent'
operations:
  receiveOwnerEvents:
    action: receive
    tags:
      - name: Message events
    channel:
      $ref: '#/channels/ownerEvents'
  receiveDeviceStatus:
    action: receive
    tags:
      - name: Message events
    channel:
      $ref: '#/channels/deviceStatus'
components:
  messages:
    SharingEvent:
      name: SharingEvent
      payload:
        $ref: './openapi.yaml#/components/schemas/RawSharingMessage'
