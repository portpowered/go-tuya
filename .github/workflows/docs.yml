name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/**'
      - 'docs/**'
      - 'pkg/tuya/internal/wire/**'
      - 'tools/wireroutes/**'
      - 'tools/check_site_links.py'
      - '.github/workflows/docs.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: Generate Tuya API wire models
        run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config pkg/tuya/internal/wire/config.yaml api/openapi.yaml
      - name: Generate Tuya wire routes
        run: go run ./tools/wireroutes
      - name: Check generated models are current
        run: |
          git ls-files --error-unmatch pkg/tuya/internal/wire/models.gen.go
          git ls-files --error-unmatch pkg/tuya/internal/wire/routes.gen.go
          git ls-files --error-unmatch pkg/tuya/internal/wire/mqtt.gen.go
          git diff --exit-code -- pkg/tuya/internal/wire/models.gen.go pkg/tuya/internal/wire/routes.gen.go pkg/tuya/internal/wire/mqtt.gen.go
      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: go test -race -coverpkg=./pkg/... -coverprofile=coverage.out ./pkg/...
      - name: Build Fumadocs site
        uses: portpowered/api-docs-website-github-action@v0.3.0
        with:
          title: go-tuya API Reference
          openapi: api/openapi.yaml
          asyncapi: api/mqtt.asyncapi.yaml
          discover: false
          guides-directory: docs/guides
          output: site
      - name: Check rendered guide links
        run: python3 tools/check_site_links.py site
      - name: Generate coverage report and badge data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          coverage="$(go run ./tools/coverage -profile coverage.out -min 0 -percent-only -filtered-profile coverage.filtered.out)"
          go tool cover -html=coverage.filtered.out -o site/coverage.html
          if awk -v value="$coverage" 'BEGIN {exit !(value >= 90)}'; then
            color=brightgreen
          elif awk -v value="$coverage" 'BEGIN {exit !(value >= 75)}'; then
            color=yellow
          else
            color=red
          fi
          node - "$coverage" "$color" <<'JS'
          const fs = require('node:fs');
          const [coverage, color] = process.argv.slice(2);
          fs.writeFileSync('site/coverage.json', `${JSON.stringify({
            schemaVersion: 1,
            label: 'coverage',
            message: `${coverage}%`,
            color,
          }, null, 2)}\n`);
          JS
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
