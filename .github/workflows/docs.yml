name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/**'
      - 'docs/**'
      - 'tuya/internal/wire/**'
      - '.github/workflows/docs.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: Generate Tuya API wire models
        run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config tuya/internal/wire/config.yaml api/openapi.yaml
      - name: Check generated models are current
        run: |
          git ls-files --error-unmatch tuya/internal/wire/models.gen.go
          git diff --exit-code -- tuya/internal/wire/models.gen.go
      - name: Build Fumadocs site
        uses: portpowered/api-docs-website-github-action@v0.3.0
        with:
          title: go-tuya API Reference
          openapi: api/openapi.yaml
          discover: false
          guides-directory: docs/guides
          output: site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
