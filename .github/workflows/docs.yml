name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/**'
      - 'docs/**'
      - 'pkg/dependencymodels/**'
      - 'tools/wireroutes/**'
      - 'tools/wiremodels/**'
      - 'tools/publicmodels/**'
      - 'pkg/tuya/*.gen.go'
      - 'tools/check_site_links.py'
      - 'tools/schemalinks/**'
      - '.github/workflows/docs.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: Regenerate and check all schema-owned files
        run: |
          make generate-wire
          generated_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$generated_status" ]; then
            echo "Regeneration changed tracked files or produced untracked artifacts:"
            echo "$generated_status"
            exit 1
          fi
      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: go test -race -coverpkg=./pkg/... -coverprofile=coverage.out ./pkg/...
      - name: Build Fumadocs site
        uses: portpowered/api-docs-website-github-action@88d47570320f9551a1c6d1f07437285e91f2bffa
        with:
          title: go-tuya implementation-derived API reference
          openapi: api/openapi.yaml
          asyncapi: api/mqtt.asyncapi.yaml
          discover: false
          guides-directory: docs/guides
          output: site
      - name: Check rendered site links
        run: python3 tools/check_site_links.py site
      - name: Check schema-supplied links
        run: go run ./tools/schemalinks -site site -schemas api/openapi.yaml,api/mqtt.asyncapi.yaml -base-path /go-tuya
      - name: Generate coverage report and badge data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          coverage="$(go run ./tools/coverage -profile coverage.out -min 0 -percent-only -filtered-profile coverage.filtered.out)"
          go tool cover -html=coverage.filtered.out -o site/coverage.html
          if awk -v value="$coverage" 'BEGIN {exit !(value >= 90)}'; then
            color=brightgreen
          elif awk -v value="$coverage" 'BEGIN {exit !(value >= 75)}'; then
            color=yellow
          else
            color=red
          fi
          node - "$coverage" "$color" <<'JS'
          const fs = require('node:fs');
          const [coverage, color] = process.argv.slice(2);
          fs.writeFileSync('site/coverage.json', `${JSON.stringify({
            schemaVersion: 1,
            label: 'coverage',
            message: `${coverage}%`,
            color,
          }, null, 2)}\n`);
          JS
      - name: Upload rendered site for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-api-docs-${{ github.sha }}
          path: site/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
