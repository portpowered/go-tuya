name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Lint (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: false
          args: --timeout=5m
      - name: Lint CLI module (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: cmd/go-tuya
          only-new-issues: false
          args: --config ../../.golangci.yml --timeout=5m ./...
      - name: Lint authentication example module (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: examples/auth
          only-new-issues: false
          args: --config ../../.golangci.yml --timeout=5m ./...
      - name: Build
        run: go build ./...
      - name: Check schema-backed wire routes
        env:
          GOTOOLCHAIN: go1.25.0
        run: make wire-routes
      - name: Test with race detector
        run: go test -race ./...
      - name: Profile library packages
        run: go test -race -coverpkg=./pkg/... -coverprofile=coverage.out -covermode=atomic ./pkg/...
      - name: Check non-generated library coverage
        run: go run ./tools/coverage -profile coverage.out -min 80
      - name: Run replay checks with separate coverage output
        run: make replay
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check CLI module metadata
        working-directory: cmd/go-tuya
        shell: bash
        run: |
          go mod tidy -diff
          test "$(go list -m)" = "github.com/portpowered/go-tuya/cmd/go-tuya"
      - name: Build and test CLI module
        working-directory: cmd/go-tuya
        run: |
          go build ./...
          go test -race ./...
          go vet ./...
      - name: Build authentication example
        working-directory: examples/auth
        run: go test ./...
      - name: Check authentication example module metadata
        working-directory: examples/auth
        shell: bash
        run: |
          go mod tidy
          git -C ../.. diff --exit-code -- examples/auth/go.mod examples/auth/go.sum
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  generation:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Regenerate every schema-owned model and route
        run: |
          make generate-wire
          generated_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$generated_status" ]; then
            echo "Regeneration changed tracked files or produced untracked artifacts:"
            echo "$generated_status"
            exit 1
          fi
