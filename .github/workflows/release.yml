name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      PUBLIC_MODULE: github.com/portpowered/go-tuya
      PUBLIC_PACKAGES: pkg/tuya
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: Lint (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: false
          args: --timeout=5m
      - name: Lint CLI module (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: cmd/go-tuya
          only-new-issues: false
          args: --config ../../.golangci.yml --timeout=5m ./...
      - name: Lint authentication example module (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: examples/auth
          only-new-issues: false
          args: --config ../../.golangci.yml --timeout=5m ./...
      - name: Verify generated wire artifacts on the tag
        run: |
          make generate-wire
          make wire-routes
          check_generated_outputs() {
            local generated_status ignored_generated
            generated_status="$(git status --porcelain --untracked-files=all -- "$@")"
            ignored_generated="$(git ls-files --others --ignored --exclude-standard -- "$@")"
            if [ -n "$generated_status" ] || [ -n "$ignored_generated" ]; then
              echo "Regeneration changed tracked generated outputs or produced untracked generated files:"
              if [ -n "$generated_status" ]; then
                echo "$generated_status"
              fi
              if [ -n "$ignored_generated" ]; then
                echo "Ignored generated files:"
                echo "$ignored_generated"
              fi
              exit 1
            fi
          }
          check_generated_outputs \
            ':(glob)pkg/**/*.gen.go' \
            ':(glob)pkg/**/*.config.yaml' \
            'api/openapi.yaml' \
            'docs/wire-model-inventory.md'
      - name: Check non-generated coverage on the tag
        run: make coverage
      - name: Check release module configuration
        run: test "$(go list -m)" = "$PUBLIC_MODULE"
      - name: Check public API compatibility
        env:
          VERSION: ${{ github.ref_name }}
        run: go run ./tools/compatibility -policy release -base previous-release -version "$VERSION" -module "$PUBLIC_MODULE" -packages "$PUBLIC_PACKAGES"
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Replay checks
        run: make replay
      - name: Verify tagged module from a fresh consumer through the public proxy
        env:
          VERSION: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
        shell: bash
        run: |
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          cd "$check_dir"
          go mod init example.com/tuya-module-check
          module_ready=false
          for attempt in {1..12}; do
            if go get "${PUBLIC_MODULE}@${VERSION}"; then
              module_ready=true
              break
            fi
            echo "Module not available through the Go module proxy yet (attempt ${attempt}/12)"
            sleep 10
          done
          if [ "$module_ready" != true ]; then
            echo "Could not fetch the tagged module after twelve attempts."
            exit 1
          fi
          resolved_module="$(go list -m -f '{{.Path}}@{{.Version}}' "$PUBLIC_MODULE")"
          expected_module="${PUBLIC_MODULE}@${VERSION}"
          if [ "$resolved_module" != "$expected_module" ]; then
            echo "Resolved $resolved_module, expected $expected_module."
            exit 1
          fi
          cat > main.go <<EOF
          package main

          import tuya "${PUBLIC_MODULE}/pkg/tuya"

          var _ func(...tuya.Option) (*tuya.Client, error) = tuya.NewClient
          var _ func(*tuya.Client, tuya.Tokens) *tuya.Session = (*tuya.Client).NewSession

          func main() {}
          EOF
          go mod tidy
          go test ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --repo "$REPOSITORY" --verify-tag --generate-notes \
            --notes "v0.4 requires your application client ID and authentication schema, types event constants, and replaces QueryDevicesByHomeAssistantDevices with QueryDevicesByHome. See the [upgrade guide](https://portpowered.github.io/go-tuya/docs/guides/upgrading/). The maintainer tested the API flows with personal accounts; published replay evidence is synthetic."
